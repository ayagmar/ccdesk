name: Release after a data update

# A Claude Code data PR (opened by the "Claude Code data" workflow) that a person merges starts the
# Release workflow, so the new schema, catalog and tools reach npm without anyone remembering to.
# These are the PRs whose docs sections changed, or that CI failed on; the PR body lists what to check.
# The data workflow releases the PRs it merges itself.
# It is always a patch, even with a feature waiting on master: minor releases are started by hand.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'chore/claude-code-data-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the Release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f increment=patch
          echo "Started a release from $BRANCH for #${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"
