name: Release

# Single release path for this package:
#   release-it bumps the version, writes CHANGELOG.md, commits, tags, pushes and
#   creates the GitHub release; then `npm publish` runs via npm trusted publishing
#   (OIDC; provenance is added automatically for public repos). No long-lived npm token is needed.
#
# One-time setup (npmjs.com → package → Settings → Trusted publishing, or from the CLI):
#   npm trust github ccdesk --repo ayagmar/ccdesk --file release.yml --allow-publish

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version bump (auto = derive from Conventional Commits)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: Dry run (no commit, tag, push, GitHub release or publish)
        type: boolean
        default: false
      publish_only:
        description: Skip release-it and only publish the version already tagged at HEAD (recovery)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      INCREMENT: ${{ inputs.increment }}
      DRY_RUN: ${{ inputs.dry_run }}
      PUBLISH_ONLY: ${{ inputs.publish_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Fail before release-it can tag or create a GitHub release for an unpublishable package.
      - name: Refuse to release a private package
        run: |
          if [ "$(node -p 'require("./package.json").private === true')" = "true" ]; then
            echo "::error::package.json is private — remove \"private\" before releasing"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version, changelog, tag and GitHub release
        if: inputs.publish_only == false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--ci)
          [ "$INCREMENT" != "auto" ] && args+=(--increment "$INCREMENT")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          pnpm exec release-it "${args[@]}"
          # A dry run leaves package.json at the released version, which npm refuses to publish
          # again; check the publish of the version this release would make instead.
          if [ "$DRY_RUN" = "true" ]; then
            next=$(pnpm exec release-it "${args[@]}" --release-version | tail -n 1)
            npm version "$next" --no-git-tag-version
          fi

      - name: Verify tagged version is unpublished
        id: version
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" != "true" ] && ! git tag --points-at HEAD | grep -qx "v$version"; then
            echo "::error::HEAD is not tagged v$version"
            exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already published"
            exit 1
          fi

      - name: Publish to npm
        run: |
          args=(--access public)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          npm publish "${args[@]}"

      - name: Summary
        if: success()
        run: |
          {
            echo "### ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}"
            if [ "$DRY_RUN" = "true" ]; then echo "Dry run — nothing was pushed or published."; fi
          } >> "$GITHUB_STEP_SUMMARY"
