name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22.19.0' }
          - { os: ubuntu-latest, node: '24.21.0' }
          - { os: macos-latest, node: '24.21.0' }
          - { os: windows-latest, node: '24.21.0' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # The generated settings schema must match the pinned claude-agent-sdk and SchemaStore snapshot.
      - run: pnpm run schema && git diff --exit-code -- src/shared/settings.schema.json src/shared/hook-events.json
      # Install the packed tarball the way npx would, start it in an empty home and load the page
      # and its script, so a file missing from "files" fails here. Importing the package checks
      # that its "exports" lead to the built core and view. Then run scan and explain on a project.
      - name: Smoke test the package
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null
          npm install ./ccdesk-*.tgz
          node --input-type=module -e 'const core = await import("ccdesk"); if (typeof core.scanDirectory !== "function") process.exit(1)'
          node --input-type=module -e 'const view = await import("ccdesk/view"); if (typeof view.buildRows !== "function") process.exit(1)'
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          npx --no -- ccdesk --no-open --port 4399 > ccdesk.log 2>&1 &
          for _ in $(seq 30); do grep -q "running at" ccdesk.log && break; sleep 1; done
          url=$(grep -o 'http://[^ #]*' ccdesk.log) || { cat ccdesk.log; exit 1; }
          script=$(curl -fsS "$url" | grep -o 'src="[^"]*\.js"' | cut -d'"' -f2)
          curl -fsS -o /dev/null "${url%/}$script"
          # The subcommands load the core only: they still run once the server's files are gone.
          rm node_modules/ccdesk/dist/server/server.js node_modules/ccdesk/dist/server/start.js
          mkdir -p "$HOME/app/.claude/rules"
          printf -- '---\npaths: ["src/**"]\n---\nKeep it small.\n' > "$HOME/app/.claude/rules/src.md"
          npx --no -- ccdesk scan "$HOME/app" --json > scan.json
          node -e 'const view = JSON.parse(require("fs").readFileSync("scan.json", "utf8")); if (!view.exists || view.instructions.length === 0) process.exit(1)'
          npx --no -- ccdesk explain "$HOME/app/src/a.ts" --dir "$HOME/app" | tee explain.txt
          grep -q "path rule .*matches src/\*\*" explain.txt
