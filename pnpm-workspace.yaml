packages:
  - site
allowBuilds:
  esbuild: false
# Claude Code's SDK is published with every Claude Code release and only feeds the generated
# settings schema, so it skips the 24 h wait pnpm puts on fresh packages.
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk*'

overrides:
  basic-ftp: 6.2.3
  undici: 7.30.1
